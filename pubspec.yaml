name: safeher
description: "SafeHer — AI & IoT based Smart Women Safety System"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.4
  firebase_messaging: ^14.7.15
  firebase_storage: ^11.6.6

  # Sensors / location
  sensors_plus: ^4.0.2
  geolocator: ^11.0.0
  permission_handler: ^11.3.0

  # State / utils
  provider: ^6.1.2
  intl: ^0.19.0
  url_launcher: ^6.2.5
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
